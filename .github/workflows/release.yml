name: Release

# Pushing a version tag (for example v0.2.0) builds the installer on GitHub, optionally signs it
# through SignPath, and publishes a GitHub release. "Run workflow" only builds and uploads the
# unsigned installer as an artifact (no release), which is handy for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist

      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: release/DeskSweep-Setup-*.exe
          if-no-files-found: error

  # Runs only after the SignPath application is approved and the repository variable
  # SIGNPATH_ENABLED is set to "true" (see docs/signing/README.md).
  sign:
    needs: build
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # a person approves the request
          output-artifact-directory: signed

      - name: Keep the signed installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    needs: [build, sign]
    # Tags only; signing may be skipped (not set up yet) but must not have failed.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer (signed if available)
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign.result == 'success' && 'installer-signed' || 'installer-unsigned' }}
          path: installer

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac   # 0.x = beta
          gh release create "$GITHUB_REF_NAME" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeskSweep $GITHUB_REF_NAME" \
            --generate-notes $flags
